<!DOCTYPE html>
<html>
<head lang="en">
    <meta http-equiv="content-type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <meta name="HandheldFriendly" content="True">
    <title>Crossword Nexus Solver</title>

    <!-- jQuery -->
    <script src="lib/jquery.js"></script>

    <!-- for loading crosswords -->
    <script src="lib/jscrossword_combined.js"></script>

    <!-- confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <!-- GG animation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js" integrity="sha512-16esztaSRplJROstbIIdwX3N97V1+pZvV33ABoG1H2OyTttBxEGkTsoIVsiP1iaTtM8b3+hu2kB6pQ4Clr5yug==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <!-- Shared JS -->
    <script src="js/crossword.shared.js"></script>

    <!-- Shared CSS -->
    <link rel="stylesheet" href="./css/crossword.shared.css">

    <!-- For app downloads -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#111111">


    <script>
        const mobile = CrosswordShared.isMobileDevice();
        console.log('[Device Detection]', {
          ua: navigator.userAgent,
          platform: navigator.platform,
          maxTouchPoints: navigator.maxTouchPoints,
          isMobile: mobile
        });

        // ✅ Load correct layout CSS synchronously to prevent FOUC (flash of unstyled content)
        const layoutLink = document.createElement('link');
        layoutLink.rel = 'stylesheet';
        layoutLink.href = mobile ? './css/crossword.mobile.css' : './css/crosswordnexus.css';
        document.head.appendChild(layoutLink);

        if (mobile) {
          // ✅ Load core engine first (crosswords.js)
          const core = document.createElement('script');
          core.src = './js/crosswords.js';

          core.onload = () => {
            // ✅ Then load mobile layout script
            const mobileScript = document.createElement('script');
            mobileScript.src = './js/crossword.mobile.js';
            document.body.appendChild(mobileScript); // ✅ Let it handle its own init
          };

          window.addEventListener('DOMContentLoaded', () => {
            document.body.appendChild(core);
          });

        } else {
          // ✅ Desktop JS + Init
          const script = document.createElement('script');
          script.src = './js/crosswords.js';
          script.onload = () => {
            console.log('[Desktop] crosswords.js loaded — initializing crossword');

            const params = CrosswordShared.getCrosswordParams();

            window.gCrossword = CrosswordNexus.createCrossword($('div.crossword'), params);

            setTimeout(() => {
              const svg = document.getElementById('cw-puzzle-grid');
              const cw = window.gCrossword;

              if (svg && cw?.renderCells && cw.grid_width && cw.grid_height) {
                console.log('[Fix] Final render pass after layout settle');
                cw.renderCells();
                cw.windowResized?.();
                cw.syncTopTextWidth?.();
              } else {
                console.warn('[Fix] Skipping renderCells — grid size not yet initialized', {
                  grid_width: cw?.grid_width,
                  grid_height: cw?.grid_height
                });
              }
            }, 350);
          };

          window.addEventListener('DOMContentLoaded', () => {
            document.body.appendChild(script);
          });
        }
      </script>

      <!-- For saving the app locally -->
      <script>
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.register('sw.js').then(() => {
            console.log('Service Worker registered!');
          });
        }
      </script>


</head>
<body>
    <noscript>
      <p style="padding:1rem; font-family:sans-serif;">
        The Crossword Nexus Solver requires JavaScript.
      </p>
    </noscript>
    <div class="crossword"></div>
</body>
</html>
